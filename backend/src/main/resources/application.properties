spring.application.name=demo-address-book

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/addressbook
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# JWT Configuration (used by JwtService for bearer token issuance/validation)
jwt.secret=your-secret-key-change-in-production
jwt.expiration=86400000

# Initial Admin seeding (FR-02) - StartupAdminSeederService creates this account
# once at startup if no ADMIN account exists yet; the generated password is
# logged once for operator retrieval and must be changed via self-service after.
admin.seed.email=admin@addressbook.local
admin.seed.address-line1=HQ
admin.seed.address-line2=
admin.seed.city=Headquarters
admin.seed.state=DC
admin.seed.zip-code=00000
admin.seed.telephone=000-000-0000
