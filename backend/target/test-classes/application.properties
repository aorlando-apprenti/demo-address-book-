spring.application.name=demo-address-book-test

# In-memory H2 for test runs (keeps ./data/addressbook file-mode DB untouched)
spring.datasource.url=jdbc:h2:mem:addressbook-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

jwt.secret=test-secret-key-for-automated-tests-only-32bytes-min
jwt.expiration=86400000

admin.seed.email=admin@addressbook.local
admin.seed.address=HQ
admin.seed.telephone=000-000-0000
